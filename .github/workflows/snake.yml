name: Contribution snake
on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']
permissions:
  contents: write
concurrency:
  group: contribution-snake
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Unslslov
          outputs: |
            contributions/snake.svg?palette=github-light&color_snake=#7857bd
            contributions/snake-dark.svg?palette=github-dark&color_snake=#c4a6ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish SVGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contributions/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update contribution snake'
          git pull --rebase origin main
          git push origin HEAD:main
